# Shared proxy settings for the LLM upstream. TLS is verified against the system CA bundle and SNI is sent, so the
# gateway cannot be pointed at an impostor endpoint by DNS tricks inside the sealed network.
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
